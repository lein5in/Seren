services:
  postgres:
    image: postgres:16-alpine
    container_name: seren-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seren
      POSTGRES_PASSWORD: seren
      POSTGRES_DB: seren
    ports:
      - "5434:5432"
    volumes:
      - seren_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seren -d seren"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  seren_postgres_data: